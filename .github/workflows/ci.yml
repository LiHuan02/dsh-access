name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The plugin targets the DSH desktop app, which is Windows-first, and the
    # browser tests speak a socket contract measured there.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
